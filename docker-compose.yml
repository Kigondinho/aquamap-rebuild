# AquaMap: PostGIS database, web application and (on request) the data pipeline.
#
#   python3 scripts/init_env.py                           # once: creates .env with random secrets
#   docker compose up -d --build --wait                   # database + app on http://127.0.0.1:8000
#   docker compose --profile pipeline run --rm pipeline   # download data, process and score it
#   docker compose down                                   # stop (data is kept in the "pgdata" volume)
#
# Secrets come only from .env (git-ignored). Both published ports listen on 127.0.0.1 only; put a
# reverse proxy with HTTPS in front for any deployment reachable from other machines.

services:
  db:
    # Pinned by digest for reproducible starts; the tag is kept for readability.
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquamap_db}
      POSTGRES_USER: ${POSTGRES_USER:-aquamap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (python3 scripts/init_env.py)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: the server PostGIS runs during first-time setup listens on a socket only, so the
      # database counts as healthy only once the real server accepts TCP connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is "db" on 5432. The schema is created or upgraded
      # by docker/entrypoint.sh before the server starts.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Data pipeline: not started by `docker compose up`.
  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      args:
        INSTALL_PIPELINE: "true"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATA_DIR: data
      HOME: /tmp
    # Write data/ as the owner of the checkout (set by scripts/init_env.py), not as root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    command: ["python", "-m", "pipeline.run_pipeline"]

volumes:
  pgdata:
