<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaMap — Nairobi road flood vulnerability</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button type="button" id="toggle-sidebar" aria-controls="sidebar" aria-expanded="false">Filters</button>
      <span class="brand">AquaMap</span>
      <span class="tagline">Road flood vulnerability, Nairobi County</span>
      <span class="spacer"></span>
      <span class="user" id="user-name"></span>
      <button type="button" id="sign-out">Sign out</button>
    </header>

    <!-- Filled from GET /api/v1/roads/summary. No numbers are written in this file. -->
    <section class="stats" id="stats" aria-label="Summary statistics" aria-live="polite">
      <p class="state" id="stats-state"><span class="spinner"></span>Loading statistics…</p>
    </section>

    <div class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Search and filters">
        <section>
          <h2><label for="search">Find a road</label></h2>
          <input id="search" type="search" placeholder="Road name, e.g. Ngong Road" autocomplete="off" maxlength="100">
          <p class="state" id="search-state" role="status" hidden></p>
          <ul class="results" id="search-results" aria-label="Search results"></ul>
        </section>

        <section>
          <h2>Vulnerability category</h2>
          <div id="tier-filters"><p class="state"><span class="spinner"></span>Loading…</p></div>
        </section>

        <section>
          <h2>IVI score</h2>
          <div class="range-values"><span>From <strong id="ivi-min-value"></strong></span><span>to <strong id="ivi-max-value"></strong></span></div>
          <label class="visually-hidden" for="ivi-min">Minimum IVI</label>
          <input id="ivi-min" type="range" step="0.1">
          <label class="visually-hidden" for="ivi-max">Maximum IVI</label>
          <input id="ivi-max" type="range" step="0.1">
          <p class="hint">1 = least vulnerable, 5 = most vulnerable.</p>
        </section>

        <section>
          <h2>Road classification</h2>
          <div class="filter-actions"><button type="button" class="link" id="classes-all">All</button><button type="button" class="link" id="classes-none">None</button></div>
          <div id="class-filters"><p class="state"><span class="spinner"></span>Loading…</p></div>
        </section>

        <section>
          <h2>Nearby roads</h2>
          <div class="field"><label for="radius">Within</label>
            <select id="radius">
              <option value="250">250 m</option><option value="500" selected>500 m</option>
              <option value="1000">1 km</option><option value="2000">2 km</option>
            </select></div>
          <div class="row">
            <button type="button" id="near-me">Near me</button>
            <button type="button" class="secondary" id="near-pick">Pick on map</button>
          </div>
          <p class="state" id="nearby-state" role="status" hidden></p>
          <ul class="results" id="nearby-results" aria-label="Nearby roads"></ul>
          <button type="button" class="link" id="nearby-clear" hidden>Clear nearby search</button>
        </section>

        <section>
          <button type="button" class="secondary" id="reset-filters">Reset all filters</button>
        </section>
      </aside>

      <div class="map-wrap">
        <div id="map" role="application" aria-label="Map of road vulnerability"></div>
        <div class="map-status" id="map-status" role="status" aria-live="polite" hidden></div>
        <aside class="legend" id="legend" aria-label="Legend" hidden></aside>
        <aside class="panel" id="road-panel" aria-label="Road information" hidden></aside>
      </div>
    </div>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
