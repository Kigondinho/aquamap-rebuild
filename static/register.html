<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — AquaMap</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth">
    <form class="auth-card" id="register-form" novalidate>
      <div class="brand">AquaMap</div>
      <h1>Create an account</h1>
      <p class="lead">You need an account to view the map.</p>
      <div id="form-message" role="alert" aria-live="polite"></div>
      <div class="field"><label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required minlength="2" maxlength="120"></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="password-hint">
        <span class="hint" id="password-hint">At least 8 characters, with a letter and a digit.</span></div>
      <div class="field"><label for="confirm_password">Repeat password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
      <button type="submit">Create account</button>
      <div class="auth-links"><span>Already registered? <a href="/login">Sign in</a></span></div>
    </form>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
