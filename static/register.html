<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — AquaMap</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="centered">
    <form class="panel" id="register-form" method="post" action="/api/v1/auth/register" novalidate>
      <h1>Create your account</h1>
      <div class="field"><label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password (at least 8 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div>
      <p class="error" id="form-error" role="alert"></p>
      <button type="submit">Create account</button>
      <p class="note">Already registered? <a href="/login">Sign in</a>.</p>
    </form>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
