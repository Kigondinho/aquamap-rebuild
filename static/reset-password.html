<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — AquaMap</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="brand">AquaMap</div>
      <h1>Reset your password</h1>
      <div id="form-message" role="alert" aria-live="polite"></div>
      <form id="forgot-form" novalidate>
        <p class="lead">Enter your email and we will send a code to set a new password.</p>
        <div class="field"><label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required></div>
        <button type="submit">Send reset code</button>
      </form>
      <form id="reset-form" novalidate hidden>
        <p class="lead">Enter the code from the email and choose a new password.</p>
        <div class="field"><label for="code">Code</label>
          <input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
        <div class="field"><label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="new-hint">
          <span class="hint" id="new-hint">At least 8 characters, with a letter and a digit.</span></div>
        <div class="field"><label for="confirm_password">Repeat new password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
        <button type="submit">Set new password</button>
      </form>
      <div class="auth-links"><span><a href="/login">Back to sign in</a></span></div>
    </div>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
