<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email — AquaMap</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth">
    <form class="auth-card" id="verify-form" novalidate>
      <div class="brand">AquaMap</div>
      <h1>Confirm your email</h1>
      <p class="lead">Enter the six-digit code we emailed you. It expires after a few minutes.</p>
      <div id="form-message" role="alert" aria-live="polite"></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="code">Code</label>
        <input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <button type="submit">Confirm email</button>
      <div class="auth-links">
        <span>No code? <button type="button" class="link" id="resend">Send a new code</button></span>
        <span><a href="/login">Back to sign in</a></span>
      </div>
    </form>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
